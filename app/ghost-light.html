<title>Ghost Light</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: one-column rehearsal app, 560px max, script pages as the hero surface, tab bar fixed at the bottom like a stage floor */
:root{
  --bg:#F3EFF2;          /* house-light paper, faint plum bias */
  --surface:#FFFFFF;
  --ink:#1E1620;
  --muted:#6E6170;
  --line:#DCD3DB;
  --curtain:#8E1F2F;     /* oxblood curtain */
  --curtain-soft:#F4E2E5;
  --lamp:#C9861E;        /* ghost-light amber */
  --lamp-soft:#FBEFD9;
  --good:#2F7A4F; --good-soft:#E1F1E7;
  --bad:#B3361F;  --bad-soft:#FBE5E0;
  --f-display:"Bodoni Moda","Didot","Noto Serif SC",serif;
  --f-script:"Courier Prime","Courier New",monospace;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141016;--surface:#1F1922;--ink:#F1EAF0;--muted:#A797A6;--line:#3A3040;
  --curtain:#E2707F;--curtain-soft:#3A1E25;--lamp:#F0B451;--lamp-soft:#382A14;
  --good:#6FCB95;--good-soft:#18301F;--bad:#F08A72;--bad-soft:#3A1E18;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141016;--surface:#1F1922;--ink:#F1EAF0;--muted:#A797A6;--line:#3A3040;
  --curtain:#E2707F;--curtain-soft:#3A1E25;--lamp:#F0B451;--lamp-soft:#382A14;
  --good:#6FCB95;--good-soft:#18301F;--bad:#F08A72;--bad-soft:#3A1E18;color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;line-height:1.1}
.brand i{font-weight:500;color:var(--curtain)}
.sub{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;text-wrap:balance;line-height:1.25}
h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
section.view{display:flex;flex-direction:column;gap:16px}

/* stub = ticket-stub card for streak */
.stub{background:var(--curtain);color:#FFF6EE;border-radius:14px;padding:18px 18px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:center;position:relative;overflow:hidden}
.stub::after{content:"";position:absolute;right:-14px;top:50%;width:28px;height:28px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.stub .num{font-family:var(--f-display);font-size:58px;line-height:1;font-weight:700;grid-row:span 2;font-variant-numeric:tabular-nums}
.stub .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.stub .txt{font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
.dot.on{background:var(--lamp);border-color:var(--lamp);color:#1E1620;font-weight:700}
.dot.today{border-color:var(--curtain)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.goal{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.goal b{font-weight:500}
.goal .cnt{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--lamp);border-radius:3px;transition:width .4s}
.goal.done .bar span{background:var(--good)}

/* script page: the rehearsal script */
.script{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px 20px 18px;font-family:var(--f-script);box-shadow:0 1px 0 var(--line),0 3px 0 -1px var(--surface),0 4px 0 -1px var(--line)}
.script .who{text-align:center;text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-size:14px}
.script .paren{text-align:center;font-style:italic;color:var(--muted);font-size:13px}
.script .line{font-size:19px;line-height:1.55;margin:8px auto 0;max-width:30ch;text-wrap:pretty}
.script .zh{font-family:var(--f-body);font-size:14px;color:var(--muted);margin:10px auto 0;max-width:34ch}
.script .src{font-family:var(--f-body);font-size:11px;color:var(--muted);text-align:right;margin-top:12px;letter-spacing:.04em}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--curtain);border-color:var(--curtain);color:#FFF6EE;font-weight:500}
.btn.lamp{background:var(--lamp-soft);border-color:var(--lamp);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;flex:none}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.list{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.item[aria-current="true"]{border-color:var(--curtain);box-shadow:inset 3px 0 0 var(--curtain)}
.item .en{font-family:var(--f-script);font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .zh{font-size:12px;color:var(--muted);grid-column:1}
.item .best{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);grid-row:span 2;align-self:center}
.item .best.hi{color:var(--good);font-weight:700}

textarea,input[type=text]{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font-family:var(--f-script);font-size:16px;line-height:1.5;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.result{border-radius:10px;padding:14px;background:var(--lamp-soft);display:flex;flex-direction:column;gap:8px}
.score{display:flex;align-items:baseline;gap:8px}
.score .big{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.words{font-family:var(--f-script);font-size:16px;line-height:1.9}
.w{padding:1px 3px;border-radius:3px}
.w.ok{background:var(--good-soft);color:var(--good)}
.w.miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.ai-box{border-left:3px solid var(--lamp);padding:4px 0 4px 12px;font-size:14px;white-space:pre-wrap}

/* scene / chat */
.scene-card{display:grid;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px}
.scene-card b{font-family:var(--f-display);font-size:17px}
.scene-card span{font-size:13px;color:var(--muted)}
.lvl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--curtain)}
.chat{display:flex;flex-direction:column;gap:14px;font-family:var(--f-script)}
.turn .who{text-transform:uppercase;font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.turn.me .who{color:var(--curtain)}
.turn .say{font-size:16px;line-height:1.55;margin-top:2px}
.turn .tr{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.turn .fb{font-family:var(--f-body);font-size:13px;background:var(--good-soft);border-radius:8px;padding:8px 10px;margin-top:6px}
.turn .fb em{font-family:var(--f-script);font-style:normal;font-weight:700}
.linkbtn{background:none;border:0;padding:0;color:var(--curtain);font-size:13px;text-decoration:underline;text-underline-offset:3px;font-family:var(--f-body)}
.thinking{font-family:var(--f-body);font-size:13px;color:var(--muted)}

/* flashcard */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:8px;min-height:230px}
.card .term{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.card .ipa{font-family:var(--f-script);color:var(--muted)}
.card .mean{font-size:17px;font-weight:500}
.card .ex{font-family:var(--f-script);font-size:15px;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.card .exzh{font-size:13px;color:var(--muted)}
.pill{align-self:flex-start;font-size:11px;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--curtain-soft);color:var(--curtain)}
.pill.known{background:var(--good-soft);color:var(--good)}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;font-size:12px;color:var(--muted);text-decoration:none}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--curtain);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:13px;z-index:6}
.play-card{display:grid;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px}
.play-card:hover,.scene-card:hover{border-color:var(--muted)}
.pc-kind{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--curtain)}
.pc-title,.play-title{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
.pc-zh{font-size:14px;color:var(--muted)}
.pc-blurb{font-size:14px;line-height:1.55}
.pc-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.play-head{display:flex;flex-direction:column;gap:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px;font-size:14px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:500}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
.script.full{padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.script.full .paren{text-align:left}
.sp{border-radius:6px;padding:6px 8px;margin:0 -8px;cursor:pointer}
.sp:hover,.sp:focus-visible{background:var(--lamp-soft)}
.sp .who{text-align:left;font-size:13px}
.whozh{font-family:var(--f-body);font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0;font-size:12px}
.verse{font-size:16px;line-height:1.6;overflow-wrap:anywhere}
.sd{font-style:italic;color:var(--muted);font-size:14px}
.sp-ai{font-family:var(--f-body);margin-top:8px;display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--lamp);padding-left:10px;cursor:default}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.lc-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lc-top .who{font-family:var(--f-script);font-weight:700;font-size:13px;letter-spacing:.06em}
.lc-top .best{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lc-top .best.hi{color:var(--good);font-weight:700}
.lc-en{font-family:var(--f-script);font-size:18px;line-height:1.5}
.lc-modern{font-size:14px;line-height:1.5}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px;color:var(--muted);vertical-align:1px}
.lc-zh{font-size:14px;color:var(--muted)}
.lc-note{font-size:13px;background:var(--lamp-soft);border-radius:8px;padding:7px 10px}
.lc-try{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
.script.run .ghost{color:var(--muted);font-size:14px;margin-bottom:10px;opacity:.75}
.script.run .ghost .who{text-align:left;font-size:11px}
.script.run .who.me{color:var(--curtain)}
.hidden-line{color:var(--muted);font-style:italic}
.note{font-size:12px;color:var(--muted);background:var(--lamp-soft);border-radius:8px;padding:8px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div>
      <p class="brand">Ghost <i>Light</i></p>
      <div class="sub">英语排练场 · Road to Broadway</div>
    </div>
    <div class="sub" id="dateLbl"></div>
  </header>

  <!-- TODAY -->
  <section class="view" id="v-today">
    <div class="stub">
      <div class="num" id="streakNum">0</div>
      <div class="lbl">Performance streak · 连续排练</div>
      <div class="txt" id="streakTxt">今天开始你的第一场排练</div>
    </div>
    <div class="week" id="week"></div>
    <div class="panel">
      <h3>今日排练单 · Today's call sheet</h3>
      <div id="goals"></div>
    </div>
    <div>
      <h3 style="margin-bottom:8px">今日台词 · Line of the day</h3>
      <div class="script" id="lotd"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="lotdPlay"></button>
        <a class="btn primary" href="#shadow" id="lotdGo">去跟读这句</a>
      </div>
    </div>
  </section>

  <!-- SCRIPTS -->
  <section class="view" id="v-scripts" hidden>
    <div id="scriptsBody" style="display:flex;flex-direction:column;gap:14px"></div>
  </section>

  <!-- SHADOW -->
  <section class="view" id="v-shadow" hidden>
    <h2>台词跟读</h2>
    <div class="chips" id="lineCats"></div>
    <div class="script" id="curLine"></div>
    <div class="row">
      <button class="btn" id="playN"></button>
      <button class="btn" id="playS"></button>
      <button class="btn lamp" id="explainBtn">AI 讲解语气</button>
    </div>
    <div class="ai-box" id="explainOut" hidden></div>
    <div class="panel">
      <h3>你来说 · Your take</h3>
      <textarea id="said" rows="2" placeholder="说出这句台词……"></textarea>
      <div class="hint" id="micHint">点输入框，用手机键盘上的麦克风说出台词（语音输入），系统听懂的就是你的发音结果。</div>
      <div class="row">
        <button class="btn" id="recBtn" hidden></button>
        <button class="btn primary" id="scoreBtn">打分</button>
      </div>
      <div class="result" id="result" hidden></div>
    </div>
    <div>
      <h3 style="margin-bottom:8px">台词本</h3>
      <div class="list" id="lineList"></div>
    </div>
  </section>

  <!-- SCENE -->
  <section class="view" id="v-scene" hidden>
    <div id="scenePick">
      <h2>AI 对手戏</h2>
      <p class="muted small" style="margin:6px 0 12px">选一场戏。AI 演对手，用简单英语接你的台词，每句都会给你中文反馈。</p>
      <div class="list" id="sceneList"></div>
      <p class="note" id="aiNote" hidden></p>
    </div>
    <div id="scenePlay" hidden>
      <div class="row" style="justify-content:space-between">
        <button class="linkbtn" id="backScene">← 换一场戏</button>
        <span class="small muted" id="sceneTurns"></span>
      </div>
      <div class="script" style="margin-top:10px">
        <div class="paren" id="sceneSet"></div>
        <div class="chat" id="chat" style="margin-top:14px"></div>
      </div>
      <div class="panel" style="margin-top:14px">
        <textarea id="myLine" rows="2" placeholder="轮到你了，说出你的台词……"></textarea>
        <div class="row">
          <button class="btn" id="hintBtn">给我提示</button>
          <button class="btn primary" id="sendBtn">说完了</button>
        </div>
        <div class="hint" id="hintOut"></div>
      </div>
    </div>
  </section>

  <!-- WORDS -->
  <section class="view" id="v-words" hidden>
    <div class="row" style="justify-content:space-between">
      <h2>剧场词汇</h2>
      <span class="prog" id="wordProg"></span>
    </div>
    <div class="chips" id="wordCats"></div>
    <div class="card" id="card"></div>
    <div class="row" style="justify-content:space-between">
      <button class="btn" id="wPrev">上一个</button>
      <button class="btn" id="wSay"></button>
      <button class="btn" id="wNext">下一个</button>
    </div>
    <div class="row">
      <button class="btn" id="wAgain" style="flex:1;justify-content:center">再看看</button>
      <button class="btn primary" id="wKnow" style="flex:1;justify-content:center">记住了</button>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<nav class="tabs" aria-label="主导航"><div class="in">
  <a href="#today" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v3M12 18v3M9 9h6l-1 6h-4z"/><circle cx="12" cy="7.5" r="1.5"/></svg>今日</a>
  <a href="#scripts" data-v="scripts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 11h7M9 15h7M9 19h4"/></svg>剧本</a>
  <a href="#shadow" data-v="shadow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>跟读</a>
  <a href="#scene" data-v="scene"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h11v8H8l-4 3z"/><path d="M15 9h5v8l-3-2h-6v-2"/></svg>对手戏</a>
  <a href="#words" data-v="words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 8h6"/></svg>词汇</a>
</div></nav>

<script>
(function(){
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>';
const MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';

/* ---------- Progress store ---------- */
const GOALS={shadow:3,scene:1,words:5};
const KEY="ghostlight.v1";
let P={days:{},best:{},known:{}};
try{const s=localStorage.getItem(KEY);if(s)P=Object.assign(P,JSON.parse(s));}catch(e){}
let dbRef=null,saveT=null;
function dkey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){const k=dkey();P.days[k]=P.days[k]||{shadow:0,scene:0,words:0};return P.days[k];}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}
  if(dbRef){clearTimeout(saveT);saveT=setTimeout(()=>{dbRef.set(JSON.parse(JSON.stringify(P))).catch(()=>{});},800);}
}
function merge(r){
  if(!r)return;
  for(const k in (r.days||{})){const a=P.days[k]||{shadow:0,scene:0,words:0},b=r.days[k];P.days[k]={shadow:Math.max(a.shadow||0,b.shadow||0),scene:Math.max(a.scene||0,b.scene||0),words:Math.max(a.words||0,b.words||0)};}
  for(const k in (r.best||{}))P.best[k]=Math.max(P.best[k]||0,r.best[k]);
  Object.assign(P.known,r.known||{});
}
function active(k){const d=P.days[k];return d&&(d.shadow+d.scene+d.words)>0;}
function streak(){
  let n=0,d=new Date();
  if(!active(dkey(d)))d.setDate(d.getDate()-1);
  while(active(dkey(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}
function bump(kind,n){today()[kind]+=n||1;save();renderToday();}

let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en-US/i.test(v.lang)&&/Samantha|Google US|Aria|Jenny|Ava/i.test(v.name))||vs.find(v=>/en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
/* Recorded clips play through <audio> (works in the app and with the phone on silent);
   the device voice is only a fallback for AI lines that have no recording. */
const NATIVE=(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())?window.Capacitor.Plugins:null;
let player=null;
function stopAll(){try{if(player){player.pause();player.onended=null;}}catch(e){}try{if(NATIVE&&NATIVE.TextToSpeech)NATIVE.TextToSpeech.stop();}catch(e){}try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();}catch(e){}}
function playClips(list,rate,onDone,base){
  stopAll();let i=0;
  const next=()=>{if(i>=list.length){if(onDone)onDone();return;}const [clip,text]=list[i++];
    const a=new Audio((base||"audio/")+clip+".mp3");player=a;a.preservesPitch=true;a.playbackRate=rate||1;
    a.onended=()=>{if(player===a)next();};
    a.play().catch(()=>{tts(text,rate);});};
  next();
}
function tts(text,rate){
  if(NATIVE&&NATIVE.TextToSpeech){NATIVE.TextToSpeech.speak({text,lang:"en-US",rate:(rate||1)*0.95}).catch(()=>noVoice());return;}
  try{
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){noVoice();return;}
    const u=new SpeechSynthesisUtterance(text);u.lang="en-US";if(voice)u.voice=voice;u.rate=(rate||1)*0.95;
    let started=false;u.onstart=()=>{started=true;};
    speechSynthesis.resume();speechSynthesis.speak(u);
    setTimeout(()=>{if(!started&&!speechSynthesis.speaking)noVoice();},1500);
  }catch(e){noVoice();}
}
function noVoice(){toast("这句是 AI 现场生成的，这个环境里没法朗读。录好的台词和单词都能正常播放。");}
let toastT=null;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},4000);}
function speak(text,rate,clip){stopAll();if(clip)playClips([[clip,text]],rate);else tts(text,rate);}

/* Listening: native speech recognition in the Android app, Web Speech in browsers that allow it */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let srBroken=false,recOn=false,recog=null;
function canListen(){return !!(NATIVE&&NATIVE.SpeechRecognition)||(!!SR&&!srBroken);}
async function listenInto(field,btn,done){
  if(NATIVE&&NATIVE.SpeechRecognition){
    const R=NATIVE.SpeechRecognition;
    try{
      const perm=await R.requestPermissions();
      if(perm&&perm.speechRecognition&&perm.speechRecognition!=="granted"){toast("需要麦克风权限才能录音，请在系统设置里允许。");return;}
      btn.classList.add("rec");
      const r=await R.start({language:"en-US",maxResults:1,partialResults:false,popup:true,prompt:"Say your line"});
      btn.classList.remove("rec");
      const txt=(r&&r.matches&&r.matches[0])||"";field.value=txt;if(txt&&done)done(txt);
    }catch(e){btn.classList.remove("rec");toast("没有听清，再试一次。");}
    return;
  }
  if(recOn){try{recog.stop();}catch(e){}return;}
  try{
    recog=new SR();recog.lang="en-US";recog.interimResults=true;recog.continuous=false;
    const label=btn.innerHTML;
    recog.onresult=ev=>{let t="";for(const r of ev.results)t+=r[0].transcript;field.value=t;};
    recog.onerror=()=>{srBroken=true;toast("这里无法使用麦克风录音。请点输入框，用手机键盘上的麦克风语音输入。");btn.hidden=true;};
    recog.onend=()=>{recOn=false;btn.classList.remove("rec");btn.innerHTML=label;const t=field.value.trim();if(t&&done&&!srBroken)done(t);};
    recog.start();recOn=true;btn.classList.add("rec");btn.innerHTML=MIC+"停止";
  }catch(e){srBroken=true;btn.hidden=true;}
}

const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean);
function align(target,said){
  const T=norm(target),S=norm(said);const n=T.length,m=S.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=T[i]===S[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const ok=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(T[i]===S[j]){ok[i]=true;i++;j++;}else if(L[i+1][j]>=L[i][j+1])i++;else j++;}
  const hit=ok.filter(Boolean).length,extra=Math.max(0,m-hit);
  const score=n?Math.max(0,Math.round(hit/n*100-extra*3)):0;
  return{score,ok,raw:target.split(/\s+/)};
}
$("scoreBtn").onclick=()=>{
  const said=$("said").value.trim();
  if(!said){$("result").hidden=false;$("result").innerHTML=`<div class="small">先说（或输入）一遍台词，再点打分。</div>`;return;}
  const r=align(cur.en,said);
  // map raw tokens to normalized ok flags
  let k=0;const words=r.raw.map(w=>{const has=norm(w).length>0;const cls=has?(r.ok[k++]?"ok":"miss"):"ok";return `<span class="w ${cls}">${esc(w)}</span>`;}).join(" ");
  const msg=r.score>=90?"非常清楚，可以上台了！":r.score>=70?"不错！红色的词再练几遍。":r.score>=40?"听懂了一部分，先慢速跟读红色的词。":"先点「慢速」听几遍，再一个词一个词地说。";
  $("result").hidden=false;
  $("result").innerHTML=`<div class="score"><span class="big">${r.score}</span><span class="small muted">/ 100</span></div><div class="words">${words}</div><div class="small">${msg}</div>`;

  P.best[cur.id]=Math.max(P.best[cur.id]||0,r.score);
  if(r.score>=60)bump("shadow");else save();
  renderShadow();
};

  $("scenePick").hidden=true;$("scenePlay").hidden=false;$("sceneSet").textContent=s.set;$("myLine").value="";$("hintOut").textContent="";

function renderChat(){

   :`<div class="turn me"><div class="who">${esc(scene.me)}</div><div class="say">${esc(t.en)}</div>${t.tip?`<div class="fb">${esc(t.tip)}${t.better&&norm(t.better).join(" ")!==norm(t.en).join(" ")?`<br>更自然的说法：<em>${esc(t.better)}</em> <button class="linkbtn" data-sayb="${i}">听</button>`:""}</div>`:""}</div>`
  ).join("")+(busy?`<div class="thinking">${esc(scene.ai)} 正在想台词……</div>`:"")+(turns.length>=13?`<div class="paren">(Curtain. 这场戏演完了，可以换一场或重新开始。)</div>`:"");

function transcript(){return turns.map(t=>(t.who==="ai"?scene.ai:scene.me)+": "+t.en).join("\n");}
function brief(){return `You are a scene partner in an English acting class for a beginner (CEFR A2) Chinese-speaking actor.
Scene: "${scene.title}". ${scene.set}

Stay in character. Use short, natural, everyday spoken English (max 18 words per line), clear emotion, no rare words.`;}
$("sendBtn").onclick=async()=>{
  const said=$("myLine").value.trim();if(!said||busy)return;
  if(!sample){$("hintOut").textContent=AI_OFF;return;}
  turns.push({who:"me",en:said});$("myLine").value="";$("hintOut").textContent="";busy=true;renderChat();
  try{
    const r=await sample.json(brief()+`

Transcript so far:
${transcript()}

Reply with only a JSON object:
{"reply":"${scene.ai}'s next line in character","zh":"simplified Chinese translation of reply","tip":"one or two sentences of encouraging feedback in simplified Chinese on the learner's last line (grammar, word choice, or how to act it)","better":"a more natural English version of the learner's last line, same meaning, or the same line if already good"}`,{modelTier:"quick"});
    const me=turns[turns.length-1];me.tip=String(r.tip||"");me.better=String(r.better||"");
    turns.push({who:"ai",en:String(r.reply||"..."),zh:String(r.zh||"")});

  }catch(e){
    turns.pop();$("myLine").value=said;

Transcript so far:
${transcript()}

function scoreLine(i,said){
  const l=STUDY.lines[i];const out=$("tr-"+i);
  if(!said){out.innerHTML=`<p class="small">先说（或输入）一遍台词，再点打分。</p>`;return;}
  const r=align(l.en,said);let k=0;
  const words=r.raw.map(w=>{const has=norm(w).length>0;const cls=has?(r.ok[k++]?"ok":"miss"):"ok";return `<span class="w ${cls}">${esc(w)}</span>`;}).join(" ");
  out.innerHTML=`<div class="result"><div class="score"><span class="big">${r.score}</span><span class="small muted">/ 100</span></div><div class="words">${words}</div></div>`;
  const key=STUDY.id+"-"+i;P.best[key]=Math.max(P.best[key]||0,r.score);
  if(r.score>=60)bump("shadow");else save();
}

  else if(d.mode){SV.mode=d.mode;SV.run=-1;stopAll();renderScripts();}
  else if(d.show){SV.show[d.show]=!SV.show[d.show];LS.set("gl.show",SV.show);renderScripts();}
  else if(d.play||d.slow){const i=+(d.play||d.slow);const l=STUDY.lines[i];playClips([[l.audio.replace(/^audio\//,"").replace(/\.mp3$/,""),l.en]],d.slow?0.7:1,null,CONTENT+"audio/");}
  else if(d.try)tryBox(+d.try);
  else if(d.score)scoreLine(+d.score,$("tt-"+d.score).value.trim());
  else if(d.rec){const i=+d.rec;listenInto($("tt-"+i),t,txt=>scoreLine(i,txt));}
  else if(d.role!=null){SV.role=d.role;SV.run=-1;stopAll();renderScripts();}
  else if("runstart" in d){SV.run=0;renderRun();}
  else if("runnext" in d){const said=$("runSaid")?$("runSaid").value.trim():"";const l=STUDY.lines[SV.run];
    if(said&&l.who===SV.role){const r=align(l.en,said);const key=STUDY.id+"-"+SV.run;P.best[key]=Math.max(P.best[key]||0,r.score);if(r.score>=60)bump("shadow");else save();}
    stopAll();SV.run++;renderRun();}
  else if("runplay" in d){const l=STUDY.lines[SV.run];playClips([[l.audio.replace(/^audio\//,"").replace(/\.mp3$/,""),l.en]],1,null,CONTENT+"audio/");}
  else if("runrec" in d){listenInto($("runSaid"),t,txt=>{const l=STUDY.lines[SV.run];const r=align(l.en,txt);$("runRes").innerHTML=`<p class="small">这一句 <b>${r.score}</b> 分</p>`;});}
  else if("reveal" in d){const l=STUDY.lines[SV.run];t.outerHTML=`<div class="line">${esc(l.en)}</div>`;}
  else if(d.nav){let a=SV.act,s=SV.scn+ +d.nav;if(s<0){a--;s=PACK.acts[a].scenes.length-1;}else if(s>=PACK.acts[a].scenes.length){a++;s=0;}SV.act=a;SV.scn=s;renderScripts();$("scriptsBody").scrollIntoView();}
  else if(d.tts){const it=PACK.acts[SV.act].scenes[SV.scn].items[+d.tts];speak(it[2].join(" ").replace(/\[[^\]]*\]/g,""),0.95);}
  else if(d.sp!=null&&!e.target.closest(".sp-ai"))explainSpeech(+d.sp);
});
$("v-scripts").addEventListener("keydown",e=>{const t=e.target.closest("[data-sp]");if(t&&(e.key==="Enter"||e.key===" ")){e.preventDefault();explainSpeech(+t.dataset.sp);}});
$("v-scripts").addEventListener("change",e=>{
  if(e.target.id==="actSel"){SV.act=+e.target.value;SV.scn=0;renderScripts();}
  else if(e.target.id==="scnSel"){SV.scn=+e.target.value;renderScripts();}
  else if(e.target.id==="hideMine"){SV.hideMine=e.target.checked;renderRun();}
});

/* ---------- Boot ---------- */
renderToday();renderShadow();renderSceneList();renderWords();route();loadCatalog();
if(window.GL_AI)sample=window.GL_AI;
(async()=>{
  const C=window.claude;if(!C||!C.use)return;
  C.use("sample").then(s=>{if(s)sample=s;else if(!sample){$("aiNote").hidden=false;$("aiNote").textContent=AI_OFF;}});
  try{
    const [db,user]=await Promise.all([C.use("db"),C.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    dbRef=db.doc(`data/users/${id}/progress`);
    const snap=await dbRef.get();
    if(snap.exists)merge(snap.data());
    save();renderToday();renderShadow();renderWords();
  }catch(e){dbRef=null;}
})();
})();
</script>
