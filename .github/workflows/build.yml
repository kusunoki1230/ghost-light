name: Build app and publish library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  library:
    name: Publish online script library (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-web.mjs
        env:
          GL_REMOTE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/content/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - uses: actions/deploy-pages@v4

  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: node scripts/build-web.mjs
        env:
          GL_REMOTE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/content/
      - run: npx cap add android
      - run: node scripts/patch-android.mjs
      - run: npx cap sync android
      - name: Gradle build
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Publish APK as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ghost-light.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest ghost-light.apk \
            --title "Ghost Light (build ${{ github.run_number }})" \
            --notes "在安卓手机上下载 ghost-light.apk 并安装。新版本会直接覆盖旧版本，学习进度保留。"
